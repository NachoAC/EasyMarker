<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>EasyMarker</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.5L12 16.3l-6.5 4.2V5A1.5 1.5 0 0 1 7 3.5z" />
      </symbol>
      <symbol id="i-reading" viewBox="0 0 24 24">
        <path d="M3 5.6c2.9-1.4 6-1.4 9 .6 3-2 6.1-2 9-.6V19c-2.9-1.4-6-1.4-9 .6-3-2-6.1-2-9-.6z" />
        <path d="M12 6.2v13.4" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.5 4.5L19 7.5" />
      </symbol>
    </svg>

    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <img src="icons/icon48.png" width="28" height="28" alt="">
          <span>EasyMarker</span>
        </div>
        <button type="button" class="btn btn-ghost" id="backup-button">
          <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
          <span data-i18n="backupButton"></span>
        </button>
      </div>
    </header>

    <main class="container">
      <div class="notice" id="notice" role="alert" hidden></div>

      <section class="view view-center" id="view-start" aria-labelledby="start-title">
        <h1 id="start-title" tabindex="-1" data-i18n="startTitle"></h1>
        <p class="lead" data-i18n="startLead"></p>
        <dl class="stats">
          <div class="stat">
            <dt data-i18n="statBookmarks"></dt>
            <dd id="stat-bookmarks">–</dd>
          </div>
          <div class="stat">
            <dt data-i18n="readingList"></dt>
            <dd id="stat-reading-list">–</dd>
          </div>
        </dl>
        <button type="button" class="btn btn-primary btn-lg" id="scan-button" data-i18n="scanButton"></button>
        <p class="hint" data-i18n="startHint"></p>
      </section>

      <section class="view view-center" id="view-scan" aria-labelledby="scan-title" hidden>
        <h1 id="scan-title" tabindex="-1" data-i18n="scanTitle"></h1>
        <div class="progress" id="progress" role="progressbar" aria-labelledby="scan-title"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-text" id="progress-text"></p>
        <ul class="tally">
          <li><span class="dot dot-ok"></span><span data-i18n="tallyOk"></span><strong id="tally-ok">0</strong></li>
          <li><span class="dot dot-update"></span><span data-i18n="tallyUpdate"></span><strong id="tally-update">0</strong></li>
          <li><span class="dot dot-remove"></span><span data-i18n="tallyRemove"></span><strong id="tally-remove">0</strong></li>
        </ul>
        <button type="button" class="btn btn-ghost" id="cancel-button" data-i18n="cancelButton"></button>
        <p class="hint" data-i18n="scanHint"></p>
      </section>

      <section class="view" id="view-review" aria-labelledby="review-title" hidden>
        <div class="review-header">
          <h1 id="review-title" tabindex="-1" data-i18n="reviewTitle"></h1>
          <p class="muted" id="review-summary" data-i18n-title="skippedHint"></p>
        </div>

        <div class="tabs" role="tablist" data-i18n-aria-label="reviewTabsLabel">
          <button type="button" class="tab" role="tab" id="tab-update" aria-controls="panel-update" aria-selected="true">
            <span data-i18n="tabUpdate"></span><span class="tab-count" id="count-update">0</span>
          </button>
          <button type="button" class="tab" role="tab" id="tab-remove" aria-controls="panel-remove" aria-selected="false" tabindex="-1">
            <span data-i18n="tabRemove"></span><span class="tab-count" id="count-remove">0</span>
          </button>
        </div>

        <section class="panel" id="panel-update" role="tabpanel" aria-labelledby="tab-update">
          <div class="panel-toolbar" id="toolbar-update">
            <label class="select-all">
              <input type="checkbox" id="select-all-update">
              <span data-i18n="selectAll"></span>
            </label>
            <span class="muted" id="selected-update"></span>
          </div>
          <ul class="rows" id="rows-update" data-list="update"></ul>
          <p class="empty" id="empty-update" data-i18n="emptyUpdate" hidden></p>
        </section>

        <section class="panel" id="panel-remove" role="tabpanel" aria-labelledby="tab-remove" hidden>
          <div class="panel-toolbar" id="toolbar-remove">
            <label class="select-all">
              <input type="checkbox" id="select-all-remove">
              <span data-i18n="selectAll"></span>
            </label>
            <span class="muted" id="selected-remove"></span>
          </div>
          <ul class="rows" id="rows-remove" data-list="remove"></ul>
          <p class="empty" id="empty-remove" data-i18n="emptyRemove" hidden></p>
        </section>
      </section>

      <section class="view view-center" id="view-icons" aria-labelledby="icons-title" hidden>
        <h1 id="icons-title" tabindex="-1" data-i18n="iconsTitle"></h1>
        <div class="progress" id="icons-progress" role="progressbar" aria-labelledby="icons-title"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="icons-progress-fill"></div>
        </div>
        <p class="progress-text" id="icons-progress-text"></p>
        <button type="button" class="btn btn-ghost" id="skip-icons-button" data-i18n="skipButton"></button>
        <p class="hint" data-i18n="iconsHint"></p>
      </section>

      <section class="view view-center" id="view-done" aria-labelledby="done-title" hidden>
        <div class="done-mark" aria-hidden="true"><svg class="icon"><use href="#i-check" /></svg></div>
        <h1 id="done-title" tabindex="-1" data-i18n="doneTitle"></h1>
        <p class="lead" id="done-summary"></p>
        <p class="muted" id="done-icons" hidden></p>
        <div class="failures" id="done-failures" hidden>
          <h2 data-i18n="doneFailuresTitle"></h2>
          <ul id="failure-list"></ul>
        </div>
        <button type="button" class="btn btn-primary" id="restart-button" data-i18n="restartButton"></button>
      </section>
    </main>

    <footer class="actionbar" id="actionbar" hidden>
      <div class="container actionbar-inner">
        <p id="selection-summary" aria-live="polite"></p>
        <div class="actionbar-buttons">
          <button type="button" class="btn btn-ghost" id="rescan-button" data-i18n="rescanButton"></button>
          <button type="button" class="btn btn-primary" id="apply-button" data-i18n="applyButton"></button>
        </div>
      </div>
    </footer>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title" data-i18n="confirmTitle"></h2>
        <dl class="confirm-counts">
          <div><dt data-i18n="tabUpdate"></dt><dd id="confirm-updates">0</dd></div>
          <div><dt data-i18n="tabRemove"></dt><dd id="confirm-removals">0</dd></div>
        </dl>
        <label class="dialog-option" id="confirm-favicons-option">
          <input type="checkbox" id="confirm-favicons" checked>
          <span>
            <strong data-i18n="confirmFavicons"></strong>
            <span class="hint" data-i18n="confirmFaviconsHint"></span>
          </span>
        </label>
        <p class="hint" data-i18n="confirmWarning"></p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost" id="confirm-backup">
            <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
            <span data-i18n="confirmBackup"></span>
          </button>
          <span class="spacer"></span>
          <button class="btn btn-ghost" value="cancel" autofocus data-i18n="cancelButton"></button>
          <button class="btn btn-primary" value="confirm" id="confirm-apply" data-i18n="confirmApply"></button>
        </div>
      </form>
    </dialog>

    <template id="row-template">
      <li class="row">
        <input type="checkbox" class="row-check">
        <div class="row-body">
          <label class="row-head">
            <svg class="icon row-source" role="img"><use href="#i-bookmark" /></svg>
            <span class="row-title"></span>
            <span class="badge"></span>
          </label>
          <div class="row-path"></div>
          <a class="row-url row-url-old" target="_blank" rel="noopener noreferrer"></a>
          <a class="row-url row-url-new" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </li>
    </template>
  </body>
</html>
